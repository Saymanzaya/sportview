AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SportView backend on AWS Lambda + API Gateway

Parameters:
  OpenAIApiKey:
    Type: String
    NoEcho: true
  TicketmasterKey:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512

Resources:
  SportViewApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: package.lambda_handler.handler
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
          TICKETMASTER_KEY: !Ref TicketmasterKey
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
