name: Deploy SportView Backend

on:
  push:
    branches: [main, m5-cicd]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        run: |
          rm -rf lambda_build
          rm -f infra/lambda_build.zip
          mkdir -p lambda_build/app

          pip install -r backend/requirements.txt -t lambda_build

          cp backend/app/__init__.py lambda_build/app/
          cp backend/app/main.py lambda_build/app/
          cp backend/app/lambda_handler.py lambda_build/app/
          cp backend/app/sport_api.py lambda_build/app/
          cp backend/app/ticket_api.py lambda_build/app/
          cp backend/app/llm_service.py lambda_build/app/
          cp backend/app/prompt_builder.py lambda_build/app/

          cd lambda_build
          zip -r ../infra/lambda_build.zip .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: terraform init -reconfigure

      - name: Terraform plan
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_ticketmaster_key: ${{ secrets.TICKETMASTER_KEY }}
          TF_VAR_sportsdb_api_key: ${{ secrets.SPORTSDB_API_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_cors_origins: "http://localhost:5173,https://zayab.d1ngwykof7h55j.amplifyapp.com"
        run: terraform plan

      - name: Terraform apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_ticketmaster_key: ${{ secrets.TICKETMASTER_KEY }}
          TF_VAR_sportsdb_api_key: ${{ secrets.SPORTSDB_API_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_cors_origins: "http://localhost:5173,https://zayab.d1ngwykof7h55j.amplifyapp.com"
        run: terraform apply -auto-approve